name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build web
        run: pnpm --filter @parallax/web build

      - name: Smoke
        run: pnpm smoke
        env:
          PARALLAX_TOKENS: '[{"token":"smoke_t","orgId":"org_smoke","scopes":["read","write","publish"]}]'
          LAIN_ADAPTER: mock
          PARALLAX_MCP_TRANSPORT: http-sse

  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Held-out composition suite
        run: pnpm test:heldout

  separation-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Held-out separation guard
        run: pnpm gate:separation
        env:
          GATE_BASE: origin/${{ github.base_ref }}

  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore stryker incremental baseline
        uses: actions/cache@v4
        with:
          path: packages/*/.stryker-tmp
          key: stryker-${{ runner.os }}-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: |
            stryker-${{ runner.os }}-${{ github.base_ref }}-

      - name: Mutation gate on changed files
        run: pnpm --filter @parallax/gates run gate:mutation
        env:
          GATE_BASE: origin/${{ github.base_ref }}

# Parallax demo: the app behind automatic HTTPS (Caddy).
# Lain runs on the host (or another VM) and is reached via LAIN_URL.
services:
  parallax:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: .env
    environment:
      LAIN_ADAPTER: real
      PARALLAX_MCP_TRANSPORT: http-sse
    volumes:
      - parallax-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      parallax:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (a DNS name pointing at this host)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  parallax-data:
  caddy-data:

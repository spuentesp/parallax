data_dir: /home/ubuntu/nvidia/.lain/federation-cluster-a
max_concurrent_indexers: 3
repos:
  - id: openshell
    packages: ["@nvidia/openshell-sdk", "openshell"]
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/OpenShell
  - id: nemo-fabric
    packages: ["nemo-fabric"]
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NeMo-Fabric
  - id: nemoclaw
    packages: ["nemoclaw"]
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NemoClaw

services:
  - name: openshell-gateway
    repo: openshell
    paths: [proto, crates]
    hosts: [localhost, 127.0.0.1]
    env: [OPENSHELL_GATEWAY]
  - name: openshell-sdk
    repo: openshell
    paths: [python, sdk]
  - name: nemo-fabric
    repo: nemo-fabric
  - name: nemoclaw
    repo: nemoclaw

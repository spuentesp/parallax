# Lain federation for the Fly demo: the two NVIDIA clusters, indexed at image build time.
# Paths are absolute: the repos are cloned into /repos by Dockerfile.fly, the index lives in /lain-data
# (NOT on the /data volume, which would hide it).
data_dir: /lain-data
max_concurrent_indexers: 2
ready_threshold: 0.0

repos:
  # Cluster A (OpenShell RPC stack)
  - id: OpenShell
    packages: ["@nvidia/openshell-sdk", "openshell"]
    source: {type: workspace_dir, path: /repos/OpenShell}
  - id: NeMo-Fabric
    packages: ["nemo-fabric"]
    source: {type: workspace_dir, path: /repos/NeMo-Fabric}
  - id: NemoClaw
    packages: ["nemoclaw"]
    source: {type: workspace_dir, path: /repos/NemoClaw}
  # Cluster B (NeMo Agent Toolkit HTTP stack)
  - id: NeMo-Agent-Toolkit
    source: {type: workspace_dir, path: /repos/NeMo-Agent-Toolkit}
  - id: NeMo-Agent-Toolkit-UI
    source: {type: workspace_dir, path: /repos/NeMo-Agent-Toolkit-UI}
  - id: NeMo-Agent-Toolkit-Examples
    source: {type: workspace_dir, path: /repos/NeMo-Agent-Toolkit-Examples}

services:
  - name: openshell-gateway
    repo: OpenShell
    paths: [proto, crates]
    hosts: [openshell, openshell-gateway, "localhost:50051", "127.0.0.1:50051"]
    env: [OPENSHELL_GATEWAY]
  - name: openshell-sdk
    repo: OpenShell
    paths: [python, sdk]
  - name: nemo-fabric
    repo: NeMo-Fabric
  - name: nemoclaw
    repo: NemoClaw
  - name: nat
    repo: NeMo-Agent-Toolkit
    hosts: [nat, nat-backend, "localhost:8000", "127.0.0.1:8000"]
    env: [NAT_BACKEND_URL, NAT_SERVER_URL, NAT_URL, NEXT_PUBLIC_NAT_URL]
  - name: nat-ui
    repo: NeMo-Agent-Toolkit-UI
  - name: nat-examples
    repo: NeMo-Agent-Toolkit-Examples

provides:
  - service: nat
    key: "http:POST /chat/stream"
    source: "nat config.yaml (general.endpoint.path)"
  - service: nat
    key: "http:POST /chat"
    source: "nat config.yaml"
  - service: nat
    key: "ws:/websocket"
    source: "nat config.yaml (general.endpoint.websocket_path)"

host_aliases:
  - host: UPSTREAM_HTTP_ORIGIN
    service: nat
    source: "nat-ui proxy/server.js (NAT_BACKEND_URL)"

data_dir: /home/ubuntu/nvidia/.lain/federation
max_concurrent_indexers: 4
repos:
  - id: nat
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NeMo-Agent-Toolkit
  - id: nat-ui
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NeMo-Agent-Toolkit-UI
  - id: nat-examples
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NeMo-Agent-Toolkit-Examples
  - id: openshell
    packages: ["@nvidia/openshell-sdk", "openshell"]
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/OpenShell
  - id: nemo-fabric
    packages: ["nemo-fabric"]
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NeMo-Fabric
  - id: nemoclaw
    packages: ["nemoclaw"]
    source:
      type: workspace_dir
      path: /home/ubuntu/nvidia/NemoClaw

services:
  - name: nat
    repo: nat
    hosts: [localhost, 127.0.0.1]
    env: [NAT_BACKEND_URL, NAT_SERVER_URL, NAT_URL, NEXT_PUBLIC_NAT_URL]
  - name: nat-ui
    repo: nat-ui
  - name: nat-examples
    repo: nat-examples
  - name: openshell-gateway
    repo: openshell
    paths: [proto, crates]
    hosts: [localhost, 127.0.0.1]
    env: [OPENSHELL_GATEWAY]
  - name: openshell-sdk
    repo: openshell
    paths: [python, sdk]
  - name: nemo-fabric
    repo: nemo-fabric
  - name: nemoclaw
    repo: nemoclaw

provides:
  - service: nat
    key: "http:POST /chat/stream"
    source: "nat config.yaml (general.endpoint.path)"
  - service: nat
    key: "http:POST /chat"
    source: "nat config.yaml"
  - service: nat
    key: "ws:/websocket"
    source: "nat config.yaml (general.endpoint.websocket_path)"

host_aliases:
  - host: UPSTREAM_HTTP_ORIGIN
    service: nat
    source: "nat-ui proxy/server.js (NAT_BACKEND_URL)"

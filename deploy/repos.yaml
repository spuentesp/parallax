data_dir: /data/lain-federation
max_concurrent_indexers: 2
repos:
  # Cluster A (OpenShell RPC Stack)
  - id: OpenShell
    packages: ["@nvidia/openshell-sdk", "openshell"]
    source:
      type: workspace_dir
      path: OpenShell
  - id: NeMo-Fabric
    packages: ["nemo-fabric"]
    source:
      type: workspace_dir
      path: NeMo-Fabric
  - id: NemoClaw
    packages: ["nemoclaw"]
    source:
      type: workspace_dir
      path: NemoClaw

  # Cluster B (NeMo Agent Toolkit HTTP Stack)
  - id: NeMo-Agent-Toolkit
    source:
      type: workspace_dir
      path: NeMo-Agent-Toolkit
  - id: NeMo-Agent-Toolkit-UI
    source:
      type: workspace_dir
      path: NeMo-Agent-Toolkit-UI
  - id: NeMo-Agent-Toolkit-Examples
    source:
      type: workspace_dir
      path: NeMo-Agent-Toolkit-Examples

services:
  # Cluster A services
  - name: openshell-gateway
    repo: OpenShell
    paths: [proto, crates]
    hosts: [openshell, openshell-gateway, "localhost:50051", "127.0.0.1:50051"]
    env: [OPENSHELL_GATEWAY]
  - name: openshell-sdk
    repo: OpenShell
    paths: [python, sdk]
  - name: nemo-fabric
    repo: NeMo-Fabric
  - name: nemoclaw
    repo: NemoClaw

  # Cluster B services
  - name: nat
    repo: NeMo-Agent-Toolkit
    hosts: [nat, nat-backend, "localhost:8000", "127.0.0.1:8000"]
    env: [NAT_BACKEND_URL, NAT_SERVER_URL, NAT_URL, NEXT_PUBLIC_NAT_URL]
  - name: nat-ui
    repo: NeMo-Agent-Toolkit-UI
  - name: nat-examples
    repo: NeMo-Agent-Toolkit-Examples

provides:
  - service: nat
    key: "http:POST /chat/stream"
    source: "nat config.yaml (general.endpoint.path)"
  - service: nat
    key: "http:POST /chat"
    source: "nat config.yaml"
  - service: nat
    key: "ws:/websocket"
    source: "nat config.yaml (general.endpoint.websocket_path)"

host_aliases:
  - host: UPSTREAM_HTTP_ORIGIN
    service: nat
    source: "nat-ui proxy/server.js (NAT_BACKEND_URL)"

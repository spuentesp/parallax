# Fly.io app for the hackathon demo (the two NVIDIA clusters). Build: Dockerfile.fly (Parallax 0.2.0 + Lain 0.16.1).
app = 'marbled-river-9619'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile.fly'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine stays up so a judge never waits through a multi-minute cold start.
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '6m'
  interval = '30s'
  method = 'GET'
  path = '/api/health'
  timeout = '10s'

[[vm]]
  # 8 GB / 4 shared CPUs: cluster A's Lain engine alone holds ~2.5 GB, and a PR assessment
  # snapshots two more commits of a large repo. At 4 GB an assessment exhausted memory
  # (LainUnavailable). Fly allows 8 GB only from shared-cpu-4x.
  size = 'shared-cpu-4x'
  memory = '8gb'

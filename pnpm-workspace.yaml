packages:
  - 'packages/*'
allowBuilds:
  canvas: true
  esbuild: true
  # Pulled in by @forge/bridge (the Jira panel); its install script only prints a donation notice.
  iframe-resizer: false
  msw: true
minimumReleaseAgeExclude:
  - fastify@5.12.7
# Stryker hace `import('typescript')` sin declararlo (fantasma) y topa con el
# typescript@7 del workspace, que ya no trae parseConfigFileTextToJson. Se le
# inyecta su propio TS 5.x para que su preprocessor de tsconfig funcione.
packageExtensions:
  '@stryker-mutator/core':
    dependencies:
      typescript: 5.9.3
      '@stryker-mutator/vitest-runner': 10.0.0
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
